name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    name: Frontend → Cloudflare Pages
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # The root lockfile is the real one: package.json declares
          # frontend/ as an npm workspace, so `npm ci` below walks up and
          # resolves against ./package-lock.json. frontend/package-lock.json
          # is a stale leftover (it does not even contain vitest) and made
          # this cache key blind to actual dependency changes.
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # --- Pre-deployment integrity suite -------------------------------
      # A green Vite build proves the module graph compiles and nothing
      # else. Deployment is gated on the checks below, in this order, so a
      # broken Nexus cannot ship because it happened to bundle.

      # `test:ci` is the full src/ suite minus a named quarantine list of
      # pre-existing, missing-content failures. Every exclusion is spelled
      # out individually, with its reason, in frontend/vitest.ci.config.js.
      # `npm run test:unit` runs the suite unfiltered for local truth.
      - name: Unit tests
        working-directory: frontend
        run: npm run test:ci

      - name: Nexus asset integrity
        working-directory: frontend
        run: npm run check:nexus-assets

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_GOOGLE_CLIENT_ID: ${{ secrets.VITE_APP_GOOGLE_CLIENT_ID }}
          VITE_APP_R2_PUBLIC_BASE_URL: ${{ secrets.VITE_APP_R2_PUBLIC_BASE_URL }}
          # Public *.workers.dev endpoint (frontend/vma-worker) -- not
          # secret, so hardcoded here rather than requiring a new repo
          # secret just to unblock the live VMA chat widget.
          VITE_APP_VMA_WORKER_URL: https://chroma-key-vma.matrixmediamoguls.workers.dev
          # Same reasoning, for frontend/shadow-twin-worker (Act II Shadow
          # Twin generation) -- public, not secret. Without this the frontend
          # bundle ships with no worker URL at all and ShadowTwinInitialization
          # reports the Chamber as unconfigured, even though the migration is
          # applied and the Worker is deployed and reachable.
          VITE_APP_SHADOW_TWIN_WORKER_URL: https://chroma-key-shadow-twin.matrixmediamoguls.workers.dev

      - name: Static route smoke checks
        working-directory: frontend
        run: npm run smoke:routes

      # Anon-key only. Asserts the deployed project actually exposes the
      # Reclamation University + Sovereign Runtime tables the Nexus reads;
      # a migration file in git is not evidence that the table exists.
      # See docs/reclamation-university-data-integrity.md.
      - name: Verify Supabase schema
        working-directory: frontend
        run: npm run verify:supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # --- Deployment ---------------------------------------------------

      - name: Verify Cloudflare Pages project access
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
          command: pages project list

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
          command: pages deploy frontend/build --project-name=chromakeyprotocol

      # --- Post-deployment smoke check ----------------------------------
      # Re-runs the same route assertions against the live deployment, so
      # "it deployed" and "it serves" are two separate facts.

      - name: Post-deployment smoke check
        working-directory: frontend
        run: npm run smoke:routes -- --base "${SMOKE_BASE_URL}"
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.deployment-url || 'https://chromakeyprotocol.pages.dev' }}
